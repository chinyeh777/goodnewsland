<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>家庭小組智慧分組系統</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: 2rem auto; padding: 0 1rem; }
        .card { border: 1px solid #ddd; padding: 1rem; margin-bottom: 1rem; border-radius: 8px; }
        .family-item { display: flex; align-items: center; margin-bottom: 0.5rem; }
        .family-item input { margin-right: 10px; transform: scale(1.2); }
        .btn { background-color: #007bff; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-size: 1rem; }
        .btn:hover { background-color: #0056b3; }
        .settings { display: flex; align-items: center; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

    <h2>👨‍👩‍👧‍👦 家庭小組智慧分組系統</h2>

    <div class="settings card">
        <label for="groupCount">預計分成幾隊：</label>
        <input type="number" id="groupCount" min="2" max="10" value="3" style="width: 50px; text-align: center;">
        <button class="btn" onclick="startGrouping()">開始智慧分組</button>
    </div>

    <div class="card">
        <h3>✅ 今日出席點名</h3>
        <div id="loading">載入名單中，請稍候...</div>
        <div id="familyListContainer"></div>
    </div>

    <script>
        // 【請將下方的 URL 替換成你剛剛發布的 GAS 網頁應用程式網址】
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbxjhDzhIXnNEwqfKOG_aTrTfnRmJhrpBZkZsz7Em54JFLf1Adi3iv1YNGgU5eZ93aTXxg/exec';
        
        let globalFamilyData = [];

        // 網頁載入時自動去 Google Sheets 抓資料
        window.onload = async function() {
            try {
                const response = await fetch(GAS_API_URL);
                globalFamilyData = await response.json();
                renderFamilyList(globalFamilyData);
            } catch (error) {
                document.getElementById('loading').innerText = "載入失敗，請檢查 API 網址是否正確。";
                console.error("Error fetching data:", error);
            }
        };

        // 將抓回來的資料渲染成 checkbox 列表
        function renderFamilyList(data) {
            const container = document.getElementById('familyListContainer');
            document.getElementById('loading').style.display = 'none';
            
            if (data.length === 0) {
                container.innerHTML = "<p>試算表中目前沒有資料。</p>";
                return;
            }

            let htmlStr = '';
            data.forEach((family, index) => {
                htmlStr += `
                    <label class="family-item">
                        <input type="checkbox" class="family-checkbox" value="${index}" checked>
                        <span>${family.familyName} (大人: ${family.adults}, 幼童: ${family.toddlers}, 大童: ${family.olderKids})</span>
                    </label>
                `;
            });
            container.innerHTML = htmlStr;
        }

        // 點擊分組按鈕時觸發的函式（下一階段在此實作演算法）
        function startGrouping() {
            const groupCount = parseInt(document.getElementById('groupCount').value);
            const checkboxes = document.querySelectorAll('.family-checkbox:checked');
            
            // 整理出今天有出席的家庭名單
            const presentFamilies = Array.from(checkboxes).map(cb => globalFamilyData[cb.value]);
            
            console.log(`準備將 ${presentFamilies.length} 個家庭分成 ${groupCount} 隊...`);
            console.log("今日出席名單：", presentFamilies);
            
            alert('名單已抓取並顯示在 Console 中！下一步我們將實作演算法。');
        }
    </script>

</body>
</html>
